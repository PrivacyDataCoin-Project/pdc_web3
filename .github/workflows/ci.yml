name: CI

on:
  push:
    branches: [dev, master, main]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --ext .ts

      - name: Unit tests
        run: npx vitest run

      - name: Tests with coverage
        run: npx vitest run --coverage
        if: matrix.node == 20

      - name: Build
        run: npx tsc

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        if: matrix.node == 20
        with:
          name: coverage
          path: coverage/

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=critical

  status:
    name: CI Status
    needs: [test, security]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.security.result }}" == "success" ]; then
            echo "✅ All builds, tests and security audit passed"
            exit 0
          else
            echo "❌ Test: ${{ needs.test.result }}, Security: ${{ needs.security.result }}"
            exit 1
          fi
